name: Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # macOS runners are the only ones GitHub bills for, even on a public repo, so the matrix
        # builds Windows and Linux and leaves the Mac build to a machine that already has one
        os:
          [
            windows-latest,
            ubuntu-latest
          ]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js and NPM
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
