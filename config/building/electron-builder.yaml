appId: com.gracecity.presenter
productName: Grace City Presenter
artifactName: GraceCityPresenter-${version}-${arch}.${ext}

# GitHub Releases feed for OTA updates. electron-updater reads app-update.yml,
# which electron-builder generates from this block, and checks this repo's
# releases for a newer version.
publish:
    - provider: github
      owner: TGKDre
      repo: FreeShow
      # a draft is invisible until somebody publishes it by hand, which is how beta.5 sat unlisted;
      # these builds are betas, so publish them as prereleases the moment the job finishes
      releaseType: prerelease

files:
    - build/electron/**
    - build/types/**
    - public/**
    - "!node_modules/@napi-rs"
    - "!**/node_modules/*/{CHANGELOG*,README*,test*,example*,docs}"
    - "!**/node_modules/*/{*.d.ts,*.ts,*.map}"
    - "!**/node_modules/{@types,typescript}/**"
    - "!**/node_modules/**/*.{pdb,iobj,ipdb,obj,lib,exp,a,o,c,cc,cpp,h,hpp,gyp*,vcxproj*,filters,sln}"
    - "!**/node_modules/**/prebuild/node-v*"
    - "!**/node_modules/grandiose/ndi/**"
    - "!**/node_modules/osr-capture/**/on12_harness.exe"

extraResources:
    # data packs: LoveWorld lyrics and the BibleShow translations, built by scripts/data/*
    - from: assets/data/
      to: data
      filter:
          - "**/*"
    - from: node_modules/slideshow/
      to: slideshow
      filter:
          - connector-*

# windows

win:
    target: NSIS
    icon: build/public/icon.png
    files:
        - "!**/node_modules/openmediatransport/lib/{macos,linux-*,win-arm64}/**"
        - "!**/node_modules/better-sqlite3/prebuilds/{darwin-*,linux*,win32-arm64}.node"
    asarUnpack:
        - "**/node_modules/macadam/**/*.node"
        - "**/node_modules/libspotifyctl/**/*"
        - "**/node_modules/openmediatransport/**"
        - "**/node_modules/sherpa-onnx-*/**"
        - "**/assets/bin/aero-peek-helper.exe"
        - "**/assets/bin/hid-input-helper.exe"
    # Azure Trusted Signing pointed at FreeShow's account; disabled for Grace City
    # builds (no FreeShow signing secrets). Windows installer is unsigned for now:
    # OTA still works, first install shows a SmartScreen "unknown publisher" prompt.
    # Add your own code-signing cert here later to remove that prompt.
    azureSignOptions: null

# linux

linux:
    files:
        - "!**/node_modules/openmediatransport/lib/{macos,win-*}/**"
        - "!**/node_modules/better-sqlite3/prebuilds/{darwin-*,linuxmusl-*,win32-*}.node"
    asarUnpack:
        - "**/node_modules/grandiose/**"
        - "**/node_modules/openmediatransport/**"
        - "**/node_modules/macadam/**/*.node"
        - "**/node_modules/libltc-wrapper/**/*"
        - "**/node_modules/sherpa-onnx-*/**"
    category: AudioVideo
    target:
        - AppImage
        - deb
        - rpm
    icon: build/public

deb:
    depends:
        - libfontconfig1
        - uuid-runtime
        - libltc11
        - libavahi-client3
        - avahi-daemon

# macos

mac:
    icon: build/public/icon.png
    files:
        - "!**/node_modules/openmediatransport/lib/{linux-*,win-*}/**"
        - "!**/node_modules/better-sqlite3/prebuilds/{linux*,win32-*}.node"
    asarUnpack:
        - "**/node_modules/macadam/**/*.node"
        - "**/node_modules/openmediatransport/**"
        - "**/node_modules/sherpa-onnx-*/**"
    target:
        - target: dmg
          arch:
              - x64
              - arm64
        - target: zip
          arch:
              - x64
              - arm64
    category: public.app-category.utilities
    hardenedRuntime: true
    gatekeeperAssess: false
    notarize: false
    identity: null # unsigned Grace City builds, same as the Windows artifact
    entitlements: scripts/macos/entitlements.mac.plist
    entitlementsInherit: scripts/macos/entitlements.mac.plist
    extendInfo:
        NSMicrophoneUsageDescription: Please give access to your microphone if you want to use it for input.
        NSCameraUsageDescription: Please give access to your camera if you want to use it for input.
        NSAudioCaptureUsageDescription: Please give access to audio capture for desktop capture.
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true

afterExtract: scripts/opus.js
afterSign: scripts/macos/notarize.js

dmg:
    background: build/public/dmg.png
    sign: false
    contents:
        - x: 140
          y: 150
        - x: 400
          y: 150
          type: link
          path: /Applications
